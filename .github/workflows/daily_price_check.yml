name: Daily Price Check

on:
  schedule:
    - cron: '0 9 * * *'   # 4:00 AM EST = 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  price-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
       run: pip install requests openpyxl gspread google-auth

      - name: Run PriceBook check (Refrigerators + TVs)
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL:    ${{ secrets.NOTIFY_EMAIL }}
        run: python daily_price_check.py

      - name: Run OPENCLAW check (Google Sheets)
        env:
          BESTBUY_API_KEY:    ${{ secrets.BESTBUY_API_KEY }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL:       ${{ secrets.NOTIFY_EMAIL }}
          GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
        run: python openclaw_gsheets.py

      - name: Commit updated files back to repo
        run: |
          git config user.name  "Price Bot"
          git config user.email "bot@pricebook"
          git add PriceBook_Combined_Final.xlsx GITHUBOPENCLAWPRICECHECK.xlsx
          git diff --staged --quiet || git commit -m "Price check — $(date +'%m/%d/%Y')"
          git push
